<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeroscape</title>
<meta name="description" content="An endlessly evolving Frutiger Aero wallpaper engine: glass ribbons, bubbles, crystal, light and water, raymarched live in WebGL2.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.35' cy='.3'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.35' stop-color='%237df'/%3E%3Cstop offset='1' stop-color='%230a6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root {
    --glass: rgba(255, 255, 255, .16);
    --glass-hi: rgba(255, 255, 255, .55);
    --edge: rgba(255, 255, 255, .45);
    --ink: #fff;
    --ink-dim: rgba(255, 255, 255, .72);
    --aqua: #6fe3ff;
    --lime: #9dff6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02060c; overflow: hidden; }
  body { font: 13px/1.3 "Segoe UI", "Frutiger", "Myriad Pro", system-ui, sans-serif; color: var(--ink); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle { cursor: none; }
  .chrome { transition: opacity .9s ease, transform .9s ease; }
  body.idle .chrome, body.hideui .chrome { opacity: 0; pointer-events: none; }
  body.idle .chrome.bottom, body.hideui .chrome.bottom { transform: translate(-50%, 12px); }

  .pane {
    background: linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.12) 48%, rgba(255,255,255,.05) 52%, rgba(255,255,255,.14) 100%);
    border: 1px solid var(--edge);
    box-shadow: 0 8px 30px rgba(0, 20, 40, .35), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 6px rgba(120,220,255,.25);
    backdrop-filter: blur(14px) saturate(1.5);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    text-shadow: 0 1px 3px rgba(0, 30, 60, .55);
  }

  .title { position: fixed; top: 18px; left: 18px; padding: 10px 18px 11px 14px; border-radius: 18px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 36px); }
  .orb { width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 28%, #fff 0 12%, #aef 24%, #3bc6ff 52%, #0a8a5a 100%);
    box-shadow: inset 0 -4px 8px rgba(0,60,40,.5), 0 2px 10px rgba(80,220,255,.6); position: relative; }
  .orb::after { content: ""; position: absolute; left: 7px; top: 3px; width: 18px; height: 10px; border-radius: 50%; background: linear-gradient(#fff, rgba(255,255,255,0)); opacity: .85; }
  .brand { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-dim); }
  #scene { font-size: 19px; font-weight: 300; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; }
  #mode { font-size: 10px; color: var(--ink-dim); opacity: .7; letter-spacing: .08em; }

  .bottom { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); border-radius: 24px; padding: 10px 14px 12px; width: min(760px, calc(100vw - 32px)); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; margin: 0 4px 10px; position: relative; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, rgba(255,255,255,.5), rgba(255,255,255,.9)); border-radius: 2px; }
  #bar.morph { background: linear-gradient(90deg, var(--aqua), var(--lime)); box-shadow: 0 0 8px var(--aqua); }
  #phase { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); min-width: 64px; text-align: center; }

  button, select {
    font: inherit; color: var(--ink); cursor: pointer; border-radius: 999px; min-height: 34px;
    border: 1px solid rgba(255,255,255,.55);
    background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.14) 50%, rgba(160,230,255,.10) 51%, rgba(200,245,255,.28) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 6px rgba(0,30,60,.3);
    text-shadow: 0 1px 2px rgba(0,30,60,.6);
  }
  button { min-width: 38px; padding: 0 12px; font-size: 14px; }
  button:hover, select:hover { background: linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(190,240,255,.3) 50%, rgba(90,210,255,.25) 51%, rgba(150,250,220,.45) 100%); box-shadow: inset 0 1px 0 #fff, 0 0 12px rgba(120,230,255,.6); }
  button:active { transform: translateY(1px); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  select { padding: 0 10px; max-width: 190px; }
  select option { color: #023; background: #e8f8ff; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,.35); margin: 0 4px; }
  label.pace { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; }
  input[type=range] { width: 90px; accent-color: var(--aqua); }
  #paceVal { min-width: 34px; color: var(--ink); }

  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 22px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; max-width: min(720px, 90vw); max-height: 80vh; overflow: auto; }
  #status.err { font: 12px/1.4 Consolas, monospace; background: rgba(60, 0, 10, .85); }
  #toast { position: fixed; top: 22px; left: 50%; transform: translate(-50%, -10px); padding: 8px 16px; border-radius: 14px; opacity: 0; transition: .3s; pointer-events: none; max-width: 90vw; word-break: break-all; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .keys { position: fixed; right: 18px; top: 18px; padding: 8px 12px; border-radius: 14px; font-size: 11px; color: var(--ink-dim); line-height: 1.6; }
  .keys b { color: var(--ink); font-weight: 600; }
  @media (max-width: 720px) { .keys { display: none; } .bottom { bottom: 12px; } #scene { font-size: 16px; } select { max-width: 140px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="chrome pane title">
  <div class="orb" aria-hidden="true"></div>
  <div style="min-width:0">
    <div class="brand">Aeroscape</div>
    <div id="scene">…</div>
    <div id="sub"></div>
    <div id="mode"></div>
  </div>
</div>

<div class="chrome pane keys" aria-label="Keyboard shortcuts">
  <b>Space</b> next · <b>←</b> back · <b>P</b> hold<br>
  <b>M</b> mutate · <b>S</b> snapshot · <b>F</b> fullscreen · <b>H</b> hide
</div>

<div class="chrome pane bottom">
  <div class="track"><div id="bar"></div></div>
  <div class="row">
    <button id="prev" title="Previous scene (←)" aria-label="Previous scene">◀</button>
    <button id="play" aria-label="Hold or resume"></button>
    <button id="next" title="Evolve to next scene (Space)" aria-label="Next scene">▶▶</button>
    <button id="mutate" title="Mutate this scene (M)">Mutate</button>
    <span id="phase"></span>
    <span class="sep"></span>
    <select id="lock" title="Keep evolving within one style">
      <option value="">All styles</option>
    </select>
    <label class="pace">Pace <input id="pace" type="range" min=".25" max="4" step=".25" value="1"><span id="paceVal">1×</span></label>
    <select id="engine" title="Smooth draws the scenes as geometry and runs well on phones; Ray traced is exact but needs a strong GPU">
      <option value="smooth">Smooth</option>
      <option value="ray">Ray traced</option>
    </select>
    <select id="quality" title="Render quality (adapts automatically within the range)">
      <option value="potato">Potato</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="ultra">Ultra</option>
    </select>
    <span class="sep"></span>
    <button id="shot" title="Save snapshot (S)" aria-label="Save snapshot">◉</button>
    <button id="link" title="Copy a link to this scene" aria-label="Copy link">⛓</button>
    <button id="full" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
  </div>
</div>

<div id="status" class="pane">Loading…</div>
<div id="toast" class="pane"></div>

<script type="module" src="js/main.js?v=7"></script>
</body>
</html>
